services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equipment_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-equipment_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # База данных изолирована: порт наружу не пробрасывается,
    # доступ к ней есть только у сервиса backend через внутреннюю docker-сеть.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equipment_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/EquipmentTracker.Api
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-equipment_tracker};Username=${POSTGRES_USER:-equipment_tracker};Password=${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}"
      Jwt__Secret: ${JWT_SECRET:?Задайте JWT_SECRET в .env (минимум 32 случайных символа)}
      Jwt__Issuer: EquipmentTracker
      Jwt__Audience: EquipmentTracker
      DefaultAdmin__Login: ${DEFAULT_ADMIN_LOGIN:-admin}
      DefaultAdmin__Password: ${DEFAULT_ADMIN_PASSWORD:?Задайте DEFAULT_ADMIN_PASSWORD в .env}
      DefaultAdmin__FullName: ${DEFAULT_ADMIN_FULLNAME:-Администратор}
      Export__OrganizationName: ${EXPORT_ORGANIZATION_NAME:-ЧЕТВЁРТЫЙ КАССАЦИОННЫЙ СУД ОБЩЕЙ ЮРИСДИКЦИИ}
      Export__OkpoCode: ${EXPORT_OKPO_CODE:-32717350}
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # Порт наружу не пробрасывается: браузер ходит к API через nginx фронтенда
    # (location /api/ → backend:8080), прямого доступа к бэкенду снаружи нет.

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
    ports:
      - "${FRONTEND_PORT:-80}:80"

  # Ежедневные зашифрованные копии БД: локально (том backup-data) + выгрузка на удалённое
  # хранилище (Яндекс Диск по WebDAV). Все настройки — в .env (BACKUP_*), см. README.
  backup:
    build:
      context: ./backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-equipment_tracker}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      PGDATABASE: ${POSTGRES_DB:-equipment_tracker}
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
      BACKUP_WEBDAV_URL: ${BACKUP_WEBDAV_URL:-https://webdav.yandex.ru}
      BACKUP_WEBDAV_USER: ${BACKUP_WEBDAV_USER:-}
      BACKUP_WEBDAV_PASSWORD: ${BACKUP_WEBDAV_PASSWORD:-}
      BACKUP_REMOTE_DIR: ${BACKUP_REMOTE_DIR:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Europe/Moscow}
      BACKUP_KEEP_LOCAL: ${BACKUP_KEEP_LOCAL:-14}
      BACKUP_KEEP_REMOTE_DAYS: ${BACKUP_KEEP_REMOTE_DAYS:-90}
      BACKUP_NOTIFY_TO: ${BACKUP_NOTIFY_TO:-}
      BACKUP_SMTP_HOST: ${BACKUP_SMTP_HOST:-smtp.yandex.ru}
      BACKUP_SMTP_PORT: ${BACKUP_SMTP_PORT:-465}
      BACKUP_SMTP_SECURITY: ${BACKUP_SMTP_SECURITY:-ssl}
      BACKUP_SMTP_USER: ${BACKUP_SMTP_USER:-}
      BACKUP_SMTP_PASSWORD: ${BACKUP_SMTP_PASSWORD:-}
      BACKUP_SMTP_FROM: ${BACKUP_SMTP_FROM:-}
    volumes:
      - backup-data:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db-data:
  backup-data:
