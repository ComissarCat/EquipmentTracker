# Общая часть сервера приложения (подключается и в HTTP-, и в HTTPS-режиме)
root /usr/share/nginx/html;
index index.html;

# API проксируется на бэкенд внутри docker-сети — браузер видит один origin,
# порт бэкенда наружу не открыт.
location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 10m;
}

# SPA: все неизвестные маршруты отдаём на index.html, чтобы работал React Router
location / {
    try_files $uri $uri/ /index.html;
}
