# HTTPS-режим: сертификат Let's Encrypt на IP-адрес. __TLS_IP__ и __HTTPS_HOST__ подставляет 40-tls.sh.
server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/acme.conf;

    # Всё остальное — на HTTPS с тем же путём: напечатанные QR-коды со ссылками http://<IP>/... продолжают работать
    location / {
        return 301 https://__HTTPS_HOST__$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/__TLS_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__TLS_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # HSTS намеренно не включён: сертификат живёт 6 дней, и при сбое продления HSTS не дал бы
    # пользователям даже вручную пройти на сайт.

    include /etc/nginx/snippets/app.conf;
}
